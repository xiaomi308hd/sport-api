name: Update MHD Sports M3U + XMLTV EPG

# Cron của GitHub hay trễ hoặc bị bỏ lượt, nên workflow tự chạy VÒNG LẶP:
# mỗi lượt chạy ~50 phút, cứ 3 phút cập nhật một lần rồi tự kích hoạt lượt kế tiếp.
# Cron chỉ còn là dự phòng để khởi động lại nếu chuỗi bị đứt.

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"
  push:
    paths:
      - "config.json"
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: write
  actions: write

# push (sửa config/script): chạy 1 lần rồi thôi, không phải chờ vòng lặp đang chạy.
concurrency:
  group: update-mhd-sports-${{ github.event_name == 'push' && 'push' || 'loop' }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    env:
      GH_TOKEN: ${{ github.token }}
      LOOP: ${{ github.event_name != 'push' && '1' || '0' }}
      LOOP_SECONDS: "3000"
      INTERVAL_SECONDS: "180"
      M3U_DEST_REPO: ${{ vars.M3U_DEST_REPO }}
      M3U_DEST_PATH: ${{ vars.M3U_DEST_PATH }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Optional: checkout a second repository that will host the public playlist.
      - name: Checkout playlist destination repository
        if: vars.M3U_DEST_REPO != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.M3U_DEST_REPO }}
          token: ${{ secrets.M3U_DEST_TOKEN }}
          path: playlist-destination

      - name: Update loop
        run: |
          if [ ! -f scripts/update.py ]; then
            echo "::error::Thiếu scripts/update.py trong repo. Hãy đẩy thư mục scripts/ lên (cùng cấp với config.json)."
            ls -la
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          end=$(( $(date +%s) + LOOP_SECONDS ))
          ok=0
          rounds=0

          while true; do
            rounds=$((rounds + 1))
            git pull --rebase --autostash -q || true

            round_ok=0
            if python scripts/update.py; then
              ok=$((ok + 1))
              round_ok=1
            else
              echo "::warning::update.py lỗi ở vòng $rounds (giữ nguyên dữ liệu cũ)"
            fi

            # When a destination repository is configured, remove the main M3U
            # from this repository's Git index but keep the generated workspace file.
            if [ -d "playlist-destination/.git" ]; then
              git rm --cached -f --ignore-unmatch thethao.m3u >/dev/null 2>&1 || true
              [ -f epg.xml ] && git add epg.xml
            else
              [ -f thethao.m3u ] && git add -f thethao.m3u
              [ -f epg.xml ] && git add epg.xml
            fi
            [ -f sources.json ] && git add sources.json
            [ -f referer_cache.json ] && git add referer_cache.json
            for f in thethao-*.m3u; do [ -f "$f" ] && git add "$f"; done

            if git diff --cached --quiet; then
              echo "Vòng $rounds: không có thay đổi."
            else
              git commit -q -m "chore: update MHD Sports playlist and EPG"
              git push -q || { git pull --rebase -q && git push -q; } || echo "::warning::push thất bại"
            fi

            # Mirror the finished playlist into another repository when configured.
            if [ -d "playlist-destination/.git" ] && [ -f "thethao.m3u" ]; then
              DEST_PATH="${M3U_DEST_PATH:-.}"
              case "$DEST_PATH" in
                /*|..|../*|*/../*|*/..) echo "::error::M3U_DEST_PATH phải là đường dẫn tương đối an toàn"; exit 1 ;;
              esac
              mkdir -p "playlist-destination/$DEST_PATH"
              cp thethao.m3u "playlist-destination/$DEST_PATH/thethao.m3u"
              git -C playlist-destination config user.name "github-actions[bot]"
              git -C playlist-destination config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git -C playlist-destination add -- "$DEST_PATH/thethao.m3u"
              if ! git -C playlist-destination diff --cached --quiet; then
                git -C playlist-destination commit -q -m "chore: update MHD Sports M3U playlist"
                git -C playlist-destination push -q || echo "::warning::không push được playlist sang repo đích"
              fi
            fi

            [ "$LOOP" = "1" ] || break
            [ $(( $(date +%s) + INTERVAL_SECONDS )) -lt "$end" ] || break
            sleep "$INTERVAL_SECONDS"
          done

          # Tự kích hoạt lượt kế tiếp để chuỗi không đứt.
          if [ "$LOOP" = "1" ]; then
            gh workflow run update-sports.yml --ref "$GITHUB_REF_NAME" \
              || echo "::warning::không tự kích hoạt được lượt sau; cron dự phòng sẽ khởi động lại"
          fi

          # Cả lượt không có vòng nào thành công => báo đỏ để thấy trong tab Actions.
          if [ "$ok" -eq 0 ]; then
            echo "::error::Không vòng nào cập nhật thành công"
            exit 1
          fi
