name: Update MHD Sports M3U + XMLTV EPG

# Cron của GitHub hay trễ hoặc bị bỏ lượt, nên workflow tự chạy VÒNG LẶP:
# mỗi lượt chạy ~50 phút, cứ 3 phút cập nhật một lần rồi tự kích hoạt lượt kế tiếp.
# Cron chỉ còn là dự phòng để khởi động lại nếu chuỗi bị đứt.

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"
  push:
    paths:
      - "config.json"
      - "scripts/**"
      - ".github/workflows/**"

permissions:
  contents: write
  actions: write

# push (sửa config/script): chạy 1 lần rồi thôi, không phải chờ vòng lặp đang chạy.
concurrency:
  group: update-mhd-sports-${{ github.event_name == 'push' && 'push' || 'loop' }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    env:
      GH_TOKEN: ${{ github.token }}
      LOOP: ${{ github.event_name != 'push' && '1' || '0' }}
      LOOP_SECONDS: "3000"
      INTERVAL_SECONDS: "180"
      M3U_DEST_REPO: ${{ vars.M3U_DEST_REPO || 'xiaomi308hd/hinh-nen' }}
      M3U_DEST_PATH: ${{ vars.M3U_DEST_PATH }}
      M3U_DEST_TOKEN_SET: ${{ secrets.M3U_DEST_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install certifi

      # Optional: checkout a second repository that will host the public playlist.
      - name: Check destination token
        if: env.M3U_DEST_REPO != '' && env.M3U_DEST_TOKEN_SET != 'true'
        run: |
          echo "::error::Chưa có secret M3U_DEST_TOKEN nên không thể đẩy playlist sang $M3U_DEST_REPO (Settings → Secrets and variables → Actions → Secrets)."
          exit 1

      - name: Checkout playlist destination repository
        if: env.M3U_DEST_REPO != ''
        uses: actions/checkout@v4
        with:
          repository: ${{ env.M3U_DEST_REPO }}
          token: ${{ secrets.M3U_DEST_TOKEN }}
          path: playlist-destination

      - name: Verify destination access
        if: env.M3U_DEST_REPO != ''
        env:
          GH_TOKEN: ${{ secrets.M3U_DEST_TOKEN }}
        run: |
          if ! info=$(gh api "repos/$M3U_DEST_REPO" --jq '[.full_name,(.private|tostring),.default_branch,((.permissions.push // "?")|tostring)]|@tsv' 2>&1); then
            echo "::error::Token không truy cập được $M3U_DEST_REPO: $info"
            exit 1
          fi
          IFS=$'\t' read -r full private branch push <<< "$info"
          echo "Repo đích: $full | private=$private | nhánh mặc định=$branch | quyền ghi=$push"
          if [ "$push" = "false" ]; then
            echo "::error::Token KHÔNG có quyền ghi vào $M3U_DEST_REPO (cần Contents: Read and write cho đúng repo này)."
            exit 1
          fi
          if [ "$private" = "true" ]; then
            echo "::warning::$M3U_DEST_REPO đang Private: ứng dụng không tải được playlist bằng URL raw công khai."
          fi
          echo "Nhánh đang checkout: $(git -C playlist-destination rev-parse --abbrev-ref HEAD)"

      - name: Update loop
        run: |
          if [ ! -f scripts/update.py ]; then
            echo "::error::Thiếu scripts/update.py trong repo. Hãy đẩy thư mục scripts/ lên (cùng cấp với config.json)."
            ls -la
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          end=$(( $(date +%s) + LOOP_SECONDS ))
          ok=0
          dest_err=0
          rounds=0

          while true; do
            rounds=$((rounds + 1))
            git pull --rebase --autostash -q || true

            round_ok=0
            if python scripts/update.py; then
              ok=$((ok + 1))
              round_ok=1
            else
              echo "::warning::update.py lỗi ở vòng $rounds (giữ nguyên dữ liệu cũ)"
            fi

            if [ -f thethao.m3u ]; then
              echo "Vòng $rounds: thethao.m3u có $(grep -c '^#EXTINF' thethao.m3u) luồng"
            else
              echo "Vòng $rounds: KHÔNG có thethao.m3u (update.py không ghi được file)"
            fi

            # When a destination repository is configured, remove the main M3U
            # from this repository's Git index but keep the generated workspace file.
            if [ -d "playlist-destination/.git" ]; then
              git rm --cached -f --ignore-unmatch thethao.m3u >/dev/null 2>&1 || true
              [ -f epg.xml ] && git add epg.xml
            else
              [ -f thethao.m3u ] && git add -f thethao.m3u
              [ -f epg.xml ] && git add epg.xml
            fi
            [ -f sources.json ] && git add sources.json
            [ -f referer_cache.json ] && git add referer_cache.json
            for f in thethao-*.m3u; do [ -f "$f" ] && git add "$f"; done

            if git diff --cached --quiet; then
              echo "Vòng $rounds: không có thay đổi."
            else
              git commit -q -m "chore: update MHD Sports playlist and EPG"
              git push -q || { git pull --rebase -q && git push -q; } || echo "::warning::push thất bại"
            fi

            # Mirror the finished playlist into another repository when configured.
            if [ -d "playlist-destination/.git" ] && [ ! -f "thethao.m3u" ]; then
              echo "::warning::Vòng $rounds: không có thethao.m3u để đẩy sang repo đích"
            fi
            if [ -d "playlist-destination/.git" ] && [ -f "thethao.m3u" ]; then
              DEST_PATH="${M3U_DEST_PATH:-.}"
              case "$DEST_PATH" in
                /*|..|../*|*/../*|*/..) echo "::error::M3U_DEST_PATH phải là đường dẫn tương đối an toàn"; exit 1 ;;
              esac
              mkdir -p "playlist-destination/$DEST_PATH"
              cp thethao.m3u "playlist-destination/$DEST_PATH/thethao.m3u"
              git -C playlist-destination config user.name "github-actions[bot]"
              git -C playlist-destination config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git -C playlist-destination add -- "$DEST_PATH/thethao.m3u"
              if git -C playlist-destination diff --cached --quiet; then
                echo "Vòng $rounds: repo đích đã có đúng nội dung này ($M3U_DEST_REPO:$DEST_PATH/thethao.m3u), không cần đẩy."
              else
                # Không rebase commit playlist cũ lên lịch sử mới của repo đích:
              # luôn đồng bộ remote trước, áp dụng lại file playlist mới nhất rồi push.
              DEST_BRANCH="$(git -C playlist-destination branch --show-current)"
              pushed=0
              for attempt in 1 2 3; do
                echo "Đồng bộ repo đích lần $attempt/3: $M3U_DEST_REPO:$DEST_BRANCH"
                if ! git -C playlist-destination fetch origin "$DEST_BRANCH" -q; then
                  echo "::warning::Không fetch được nhánh $DEST_BRANCH (lần $attempt)"
                  sleep 2
                  continue
                fi
                if ! git -C playlist-destination reset --hard "origin/$DEST_BRANCH" -q; then
                  echo "::warning::Không reset được repo đích về origin/$DEST_BRANCH"
                  sleep 2
                  continue
                fi

                # Sau mỗi lần đồng bộ, chép lại playlist vừa tạo để không mất dữ liệu mới.
                cp thethao.m3u "playlist-destination/$DEST_PATH/thethao.m3u"
                git -C playlist-destination add -- "$DEST_PATH/thethao.m3u"
                if git -C playlist-destination diff --cached --quiet; then
                  echo "Repo đích đã có đúng playlist mới nhất; không cần commit."
                  pushed=1
                  break
                fi

                git -C playlist-destination commit -q -m "chore: update MHD Sports M3U playlist"
                if git -C playlist-destination push -q origin "HEAD:$DEST_BRANCH" 2>/tmp/push_err.txt; then
                  echo "Đã đẩy thethao.m3u sang $M3U_DEST_REPO ($(git -C playlist-destination log -1 --format='%h %s'))"
                  pushed=1
                  break
                fi
                echo "::warning::Push repo đích chưa thành công ở lần $attempt; sẽ fetch và áp dụng lại playlist."
                sleep 2
              done
              if [ "$pushed" -ne 1 ]; then
                dest_err=1
                echo "::error::Không push được sang $M3U_DEST_REPO sau 3 lần thử: $(tr '\n' ' ' < /tmp/push_err.txt 2>/dev/null || true)"
              fi
              fi
            fi

            [ "$LOOP" = "1" ] || break
            [ $(( $(date +%s) + INTERVAL_SECONDS )) -lt "$end" ] || break
            sleep "$INTERVAL_SECONDS"
          done

          # Tự kích hoạt lượt kế tiếp để chuỗi không đứt.
          if [ "$LOOP" = "1" ]; then
            gh workflow run update-sports.yml --ref "$GITHUB_REF_NAME" \
              || echo "::warning::không tự kích hoạt được lượt sau; cron dự phòng sẽ khởi động lại"
          fi

          # Có lỗi đẩy sang repo đích => báo đỏ để không bị im lặng.
          if [ "$dest_err" -ne 0 ]; then
            echo "::error::Lượt này có lỗi đẩy playlist sang repo đích"
            exit 1
          fi

          # Cả lượt không có vòng nào thành công => báo đỏ để thấy trong tab Actions.
          if [ "$ok" -eq 0 ]; then
            echo "::error::Không vòng nào cập nhật thành công"
            exit 1
          fi
